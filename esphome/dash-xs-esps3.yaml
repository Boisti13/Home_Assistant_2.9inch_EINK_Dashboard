binary_sensor:
  # input_boolean.dash_xs_keep_awake (packages/dash_xs.yaml): on = don't
  # sleep, for OTA updates. Switching it off sends the device back to sleep.
  - platform: homeassistant
    id: keep_awake
    entity_id: ${keep_awake}
    # on_state skips the initial state, so this only fires on a real switch
    on_state:
      - if:
          condition:
            lambda: "return x;"
          then:
            - deep_sleep.prevent: deep_sleep_1
          else:
            - script.execute: go_to_sleep

