# Copy into Home Assistant's /homeassistant/esphome/secrets.yaml and fill in
wifi_ssid: "your-wifi"
wifi_password: "your-wifi-password"
ap_password: "fallback-hotspot-password"
dash_xs_key: "generate with: openssl rand -base64 32"
dash_xs_ota_password: "any-password"
# Fixed address, no DHCP on each wake (reserve it on the router too)
dash_xs_ip: 192.168.1.60
dash_xs_gateway: 192.168.1.1
dash_xs_subnet: 255.255.255.0
